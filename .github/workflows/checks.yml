# Every push and pull request: the same checks as tests/run.sh on your own
# machine (shell scripts, QML, the Hyprland configs, the logic tests, Qt's
# JavaScript engine against Node, and the plugin build).
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk --no-install-recommends \
            shellcheck lua5.4 cmake g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml-qt6 qml6-module-qtquick qml6-module-qtqml-workerscript \
            libpipewire-0.3-dev libwayland-dev libwayland-bin libgl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run every check
        run: tests/run.sh
