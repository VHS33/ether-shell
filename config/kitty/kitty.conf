# ~/.config/kitty/kitty.conf  (Ether Shell)
# Colours come from matugen (colors.conf); the background opacity from
# Settings > Glass (shell-settings.conf).  Both are includes near the
# end, so they win over anything above them.

font_family          JetBrainsMono Nerd Font
font_size            12
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell    no
cursor_shape         beam

background_opacity   0.75

include colors.conf
# the 16 terminal colours, from a pass of their own (see config-terminal.toml)
include ansi.conf

# written by the quickshell settings panel
dynamic_background_opacity yes
include shell-settings.conf

# your own settings (your shell, font, anything): put them in user.conf,
# next to this file.  It's read last, so it wins, and updates never touch it.
globinclude user*.conf
