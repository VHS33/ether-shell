# written by the quickshell settings panel (Desktop > Lock screen);
# change it there, hand edits are replaced.
$clock_cmd   = echo "<span font_weight='200'>$(date +'%-I:%M')</span><span font_size='30pt' font_weight='400'> $(date +'%p')</span>"
$blur_passes = 3
$blur_size   = 8
$dim         = 0.55
$greet_cmd   = case $(date +%H) in 0[5-9]|1[01]) echo "Good morning, $(whoami)";; 1[2-6]) echo "Good afternoon, $(whoami)";; 1[7-9]|2[01]) echo "Good evening, $(whoami)";; *) echo "Good night, $(whoami)";; esac
$media_cmd   = playerctl metadata --format '{{title}}   {{artist}}' 2>/dev/null
