# ~/.config/hypr/hyprlock.conf
# hyprlock still uses hyprlang, not Lua; only Hyprland itself moved.
#
# Colours and the wallpaper path come from matugen; the clock format,
# blur, dimming, greeting and now-playing line come from the quickshell
# Settings panel (Desktop > Lock screen), which rewrites
# hyprlock-settings.conf.  Change the layout here, the values there.
source = ~/.config/hypr/hyprlock-colors.conf
source = ~/.config/hypr/hyprlock-settings.conf

general {
    hide_cursor        = true
    grace              = 0
    ignore_empty_input = true
}

# ---- your wallpaper, blurred and dimmed ---------------------------
background {
    monitor     =
    path        = $wallpaper
    blur_passes = $blur_passes
    blur_size   = $blur_size
    brightness  = $dim
    vibrancy    = 0.18
    contrast    = 1.0
}

# ---- date, above the clock ----------------------------------------
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color       = $on_surface_variant
    font_size   = 20
    font_family = Noto Sans
    position    = 0, 300
    halign      = center
    valign      = center
}

# ---- clock: thin, large, AM/PM small beside it ----------------------
label {
    monitor     =
    text        = cmd[update:1000] $clock_cmd
    color       = $on_surface
    font_size   = 128
    font_family = Noto Sans
    position    = 0, 190
    halign      = center
    valign      = center
}

# ---- greeting -------------------------------------------------------
label {
    monitor     =
    text        = cmd[update:60000] $greet_cmd
    color       = $primary
    font_size   = 20
    font_family = Noto Sans
    position    = 0, 60
    halign      = center
    valign      = center
}

# ---- password: a soft glass pill ------------------------------------
input-field {
    monitor           =
    size              = 400, 58
    outline_thickness = 2
    rounding          = -1

    outer_color       = rgba(ffffff1a)
    inner_color       = $surface
    font_color        = $on_surface
    font_family       = Noto Sans
    check_color       = $primary
    fail_color        = $error
    capslock_color    = $tertiary

    dots_size         = 0.2
    dots_spacing      = 0.35
    dots_center       = true
    dots_rounding     = -1

    placeholder_text  = <span foreground='##ffffff99'>Enter password</span>
    fail_text         = <b>$FAIL</b>
    fail_timeout      = 2500
    fade_on_empty     = false

    position          = 0, -70
    halign            = center
    valign            = center
}

# ---- what's playing, near the bottom --------------------------------
label {
    monitor     =
    text        = cmd[update:2000] $media_cmd
    color       = $on_surface_variant
    font_size   = 14
    font_family = Noto Sans
    position    = 0, 70
    halign      = center
    valign      = bottom
}
