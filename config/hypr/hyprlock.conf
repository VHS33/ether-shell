# ~/.config/hypr/hyprlock.conf  (Ether Shell)
# hyprlock still uses hyprlang, not Lua; only Hyprland itself moved.
#
# The Ether Shell look: Inter for words, Material Symbols for icons, your
# wallpaper blurred behind, and a tonal password pill in the wallpaper's
# colours.  Colours and the wallpaper path come from matugen
# (hyprlock-colors.conf); the clock format, blur, dimming, greeting and the
# now-playing line come from Settings > Lock screen (hyprlock-settings.conf).
# Change the layout here, the values there.
#
# (In hyprlang a "#" inside a value must be written "##".)
# Fallbacks, so the lock screen always loads: hyprlock-colors.conf (next)
# replaces them with your wallpaper's colours.  Without these, a colour
# file from before a new one was added would leave hyprlock unable to start.
$field                = rgba(2b2b33b3)
$hairline             = rgba(8a8a9a80)
$primary_container    = rgba(3b3f6ee6)
$on_primary_container = rgb(dde1ff)

# the wallpaper: setwall writes it to a file of its own; until it has, the
# screen as it was
$wallpaper            = screenshot

source = ~/.config/hypr/hyprlock-colors.conf
source = ~/.config/hypr/hyprlock-settings.conf
source = ~/.config/hypr/hyprlock-wallpaper.conf

general {
    hide_cursor        = true
    grace              = 0
    ignore_empty_input = true
}

# ---- your wallpaper, blurred and dimmed ---------------------------
background {
    monitor     =
    path        = $wallpaper
    blur_passes = $blur_passes
    blur_size   = $blur_size
    brightness  = $dim
    vibrancy    = 0.18
    contrast    = 1.0
}

# ---- a lock, in the accent colour ----------------------------------
label {
    monitor     =
    text        = lock
    color       = $primary
    font_size   = 26
    font_family = Material Symbols Rounded
    position    = 0, 395
    halign      = center
    valign      = center
}

# ---- date, above the clock ----------------------------------------
label {
    monitor     =
    text        = cmd[update:60000] echo "$(date +'%A, %-d %B')"
    color       = $on_surface_variant
    font_size   = 19
    font_family = Inter
    position    = 0, 318
    halign      = center
    valign      = center
}

# ---- clock: light and large, AM/PM small beside it --------------------
label {
    monitor     =
    text        = cmd[update:1000] $clock_cmd
    color       = $on_surface
    font_size   = 132
    font_family = Inter
    position    = 0, 196
    halign      = center
    valign      = center
}

# ---- greeting -------------------------------------------------------
label {
    monitor     =
    text        = cmd[update:60000] $greet_cmd
    color       = $primary
    font_size   = 19
    font_family = Inter
    position    = 0, 62
    halign      = center
    valign      = center
}

# ---- password: a tonal pill -----------------------------------------
# accent while checking, red when it's wrong, tertiary with Caps Lock on
input-field {
    monitor           =
    size              = 380, 56
    outline_thickness = 2
    rounding          = -1

    outer_color       = $hairline
    inner_color       = $field
    font_color        = $on_surface
    font_family       = Inter
    check_color       = $primary
    fail_color        = $error
    capslock_color    = $tertiary

    dots_size         = 0.2
    dots_spacing      = 0.35
    dots_center       = true
    dots_rounding     = -1

    placeholder_text  = <span foreground='##ffffff80'>Password</span>
    fail_text         = <span font_family='Inter'>$FAIL</span>
    fail_timeout      = 2500
    fade_on_empty     = false

    position          = 0, -64
    halign            = center
    valign            = center
}

# ---- what's playing, near the bottom --------------------------------
# a music note and the song; nothing at all when nothing plays.  Titles
# are escaped so an & or < in them can't break the formatting.
label {
    monitor     =
    text        = cmd[update:2000] $media_cmd | head -n1 | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/^\(..*\)$/<span font_family="Material Symbols Rounded" foreground="##ffffffb3">music_note<\/span>   \1/'
    color       = $on_surface_variant
    font_size   = 14
    font_family = Inter
    position    = 0, 64
    halign      = center
    valign      = bottom
}
