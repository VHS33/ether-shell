[general]
bars = 28
# 30 readings a second is plenty for 28 bars; 60 kept the media drawer
# redrawing constantly for no visible gain
framerate = 30
autosens = 1

[smoothing]
# cava smooths the bars itself, so the shell needn't animate between readings
noise_reduction = 77

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
