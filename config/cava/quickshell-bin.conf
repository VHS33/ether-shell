# ~/.config/cava/quickshell-bin.conf  (Ether Shell)
# The visualiser's settings for the native reader (Ether.Native): the same
# as quickshell.conf, but sending compact binary frames instead of text.
[general]
bars = 28
framerate = 30
autosens = 1

[smoothing]
noise_reduction = 77

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = binary
bit_format = 16bit
