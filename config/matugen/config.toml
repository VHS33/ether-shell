# ~/.config/matugen/config.toml  (Ether Shell)
#
#   setwall <image>  ->  palette derived from the image, written into
#                        every app below, each reloaded by its post_hook
#
# setwall also passes --type, --contrast, --prefer and --mode from
# ~/.config/matugen/shell-theme, which Settings > Theme writes.

# The terminal's colours: real red, green, yellow, blue, magenta and cyan,
# each gently turned towards the wallpaper's hue ("blend", Material's
# harmonising) so they belong with it but keep their meaning.  matugen
# gives each the full set of roles (red, on_red, red_container,
# on_red_container, ...), toned for dark or light, readable on the
# background (checked: at least 6:1 in light mode, 10:1 in dark).
[config.custom_colors]
red     = { color = "#e5484d", blend = true }
green   = { color = "#46a758", blend = true }
yellow  = { color = "#e8c547", blend = true }
blue    = { color = "#3e8ef7", blend = true }
magenta = { color = "#c451c9", blend = true }
cyan    = { color = "#2bb5b4", blend = true }

[config.wallpaper]
command = "awww img {{ image }} --transition-type grow --transition-fps 60 --transition-duration 0.4"
set     = true

# re-reads the palette in place; restarting the shell would close panels
[templates.quickshell]
input_path  = "~/.config/matugen/templates/quickshell-colors.json"
output_path = "~/.config/quickshell/colors.json"
post_hook   = "qs ipc call theme reload"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty-colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook   = "pkill -USR1 -x kitty"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Hyprland only watches hyprland.lua, not files it dofile()s, so the
# reload has to be explicit or borders keep their old colours.
[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "hyprctl reload"

[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk4.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# KDE apps need both the [Colors:*] blocks in kdeglobals and a named
# scheme file.  setwall tells open KDE apps to reload once all are written.
[templates.kde]
input_path  = "~/.config/matugen/templates/kdeglobals"
output_path = "~/.config/kdeglobals"

[templates.kdescheme]
input_path  = "~/.config/matugen/templates/Matugen.colors"
output_path = "~/.local/share/color-schemes/Matugen.colors"

# fish's command-line colours, and btop's
[templates.fish]
input_path  = "~/.config/matugen/templates/fish-colors.fish"
output_path = "~/.config/fish/conf.d/ether-colors.fish"

[templates.btop]
input_path  = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/ether.theme"

# your starship prompt, in the wallpaper's colours (fish is pointed at it)
[templates.starship]
input_path  = "~/.config/matugen/templates/starship.toml"
output_path = "~/.config/starship/ether.toml"

# Discord, through a client mod (Vencord, Vesktop, Equibop or BetterDiscord):
# the theme goes into whichever of their theme folders exist, and they
# reload it live.  Nothing is created for mods that aren't installed.
[templates.discord]
input_path  = "~/.config/matugen/templates/discord.theme.css"
output_path = "~/.cache/ether/discord/ether.theme.css"
post_hook   = "sh -c 'for d in \"$HOME/.config/Vencord/themes\" \"$HOME/.config/vesktop/themes\" \"$HOME/.config/equibop/themes\" \"$HOME/.config/BetterDiscord/themes\"; do [ -d \"$d\" ] && cp \"$HOME/.cache/ether/discord/ether.theme.css\" \"$d/\"; done; true'"

# Firefox, through the Pywalfox add-on (it reads pywal's colour file)
[templates.pywal]
input_path  = "~/.config/matugen/templates/pywal-colors.json"
output_path = "~/.cache/wal/colors.json"
post_hook   = "sh -c 'command -v pywalfox >/dev/null && pywalfox update; true'"
