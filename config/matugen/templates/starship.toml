# generated by matugen — do not edit (Ether Shell)
# Your prompt, in your wallpaper's colours.  The layout is the one from your
# own ~/.config/starship.toml (which isn't touched); to change the layout,
# edit ~/.config/matugen/templates/starship.toml.  To go back to your own
# file, delete the STARSHIP_CONFIG line in ~/.config/fish/conf.d/ether-colors.fish.
add_newline = false
palette = "ether"
format = """
$directory\
$git_branch\
$git_status\
$character"""

[character]
success_symbol = "[λ](bold tertiary)"
error_symbol = "[λ](bold red)"

[directory]
style = "bold primary"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold tertiary"

[git_status]
style = "yellow"

[palettes.ether]
primary = "{{colors.primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.yellow.default.hex}}"
blue = "{{colors.blue.default.hex}}"
magenta = "{{colors.magenta.default.hex}}"
cyan = "{{colors.cyan.default.hex}}"
dim = "{{colors.outline.default.hex}}"
