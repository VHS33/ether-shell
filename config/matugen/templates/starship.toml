# generated by matugen — do not edit (Ether Shell)
# Your prompt, in your wallpaper's colours.  Starship reads this file, not
# ~/.config/starship.toml (fish is pointed here by STARSHIP_CONFIG).  To
# change the layout, edit ~/.config/matugen/templates/starship.toml; the
# next wallpaper change (or `ether theme`) applies it.  To use your own
# file instead: set -Ue STARSHIP_CONFIG
add_newline = false
palette = "ether"
format = """
$directory\
$git_branch\
$git_status\
$rust\
$cmd_duration\
$character"""

[character]
success_symbol = "[λ](bold tertiary)"
error_symbol = "[λ](bold red)"

[directory]
style = "bold primary"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold tertiary"

[git_status]
style = "yellow"

# a Rust mark inside a Rust project (a Cargo.toml).  Just the mark: the
# version would run rustc before every prompt there (2 ms prompt → 500+)
[rust]
symbol = " "
style = "bold secondary"
format = "[$symbol]($style)"

# how long the last command took, when it was over 2 seconds
[cmd_duration]
min_time = 2000
style = "dim"
format = "[$duration ]($style)"

[palettes.ether]
primary = "{{colors.vivid_value.default.hex}}"
secondary = "{{colors.second_value.default.hex}}"
tertiary = "{{colors.third_value.default.hex}}"
red = "{{colors.red.default.hex}}"
green = "{{colors.green.default.hex}}"
yellow = "{{colors.yellow.default.hex}}"
blue = "{{colors.blue.default.hex}}"
magenta = "{{colors.magenta.default.hex}}"
cyan = "{{colors.cyan.default.hex}}"
dim = "{{colors.outline.default.hex}}"
